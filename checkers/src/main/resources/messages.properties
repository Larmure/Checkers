#Rules and Gameplay
game.rules=RULES:\n\
- The board is 8x8. Each player starts with 12 pieces on the dark squares.\n\
- Pieces move diagonally forward, one square at a time.\n\
- To capture an opponent's piece, jump over it diagonally to the empty square behind it.\n\
- If you can capture, you must. You can chain multiple captures in one turn.\n\
- Reach the opponent's back row to become a King (moves diagonally in all directions).\n\
- The player who captures all opponent's pieces (or blocks them) wins.\n\
\n\
To apply movements, enter for example: E1 F2
