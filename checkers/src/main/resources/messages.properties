#Help and Usage
help=List of available commands:
command.not_found=Command not found: 
command.no_help=There is no help for command: 
help.help=help [CMD] : Display the help of the shell of 'CMD'.
hint.help=hint : Display a recommended move.
load.help=load [FILE] : Load a game from the specified file.
new.help=new [ARGS] : Start a new game\nARGS availaible : -blitz\n-time [MINUTES]\n-contest\n-size [8|10|12]
pause.help=pause : Pause the game
quit.help=quit : Quit the game
redo.help=redo [N] : Replay the last canceled move. (or the N-last)
save.help=save [FILE] : Save the current game to the specified file.
set.help=set PARAM=VALUE : Change the current configuration.\nExemple: 'set debug=true'
show.help=show board|history|time|configuration : Display the board, moves history, the remaining time of each player or the configuration.
undo.help=undo [N] : Cancel the last move. (or the N-last)

