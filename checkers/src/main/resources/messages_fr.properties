#Règles et Jeu
game.rules=RÈGLES :\n\
- Le plateau est de 8x8. Chaque joueur commence avec 12 pions sur les cases foncées.\n\
- Les pions se déplacent en diagonale vers l'avant, d'une case à la fois.\n\
- Pour capturer un pion adverse, sautez par-dessus vers la case vide située derrière.\n\
- Si vous pouvez capturer, vous devez le faire. Les captures multiples sont possibles en un tour.\n\
- Atteignez la dernière rangée adverse pour devenir une Dame (se déplace en diagonale dans toutes les directions).\n\
- Le joueur qui capture tous les pions adverses (ou les bloque) gagne.\n\
\n\
Pour jouer un coup, entrez par exemple : E1 F2
