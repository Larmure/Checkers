#Utilisation et Aide de commandes
help=Liste des commandes disponibles:\n
command.not_found=Commande introuvable : 
command.no_help=Aucune aide disponible pour la commande : 
help.help=help [CMD] : Affiche l'aide du shell ou de la commande 'CMD'.
hint.help=hint : Affiche un mouvement recommandé.
load.help=load [FICHIER] : Charge une partie depuis le fichier spécifié.
new.help=new [ARGS] : Démarre une nouvelle partie\nARGS disponibles : -blitz\n-time [MINUTES]\n-contest\n-size [8|10|12]
pause.help=pause : Met la partie en pause
quit.help=quit : Quitte le jeu
redo.help=redo [N] : Rejoue le dernier mouvement annulé. (ou les N derniers)
save.help=save [FICHIER] : Sauvegarde la partie actuelle dans le fichier spécifié.
set.help=set PARAM=VALEUR : Modifie la configuration actuelle.\nExemple : 'set debug=true'
show.help=show board|history|time|configuration : Affiche le plateau, l'historique des coups, le temps restant de chaque joueur ou la configuration.
undo.help=undo [N] : Annule le dernier mouvement. (ou les N derniers)

